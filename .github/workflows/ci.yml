name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ShellCheck
        run: shellcheck scripts/get_splunkbase_urls.sh
      - name: Ruff
        run: pipx run ruff check --select E,F,W --line-length 120 scripts tests

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.12" } # ships bash 3.2 and BSD tools
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tool versions
        run: |
          bash --version | head -1
          jq --version
          curl --version | head -1
      - name: Unit and contract tests
        run: python -m unittest discover -s tests -v

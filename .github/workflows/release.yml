name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v2.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag must match SKILL.md version
        run: |
          declared="$(sed -n 's/^  version: *//p' SKILL.md | head -1)"
          if [ "v${declared}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} does not match SKILL.md metadata.version ${declared}"
            exit 1
          fi

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Build skill archive
        run: git archive --format=zip --prefix=splunkbase-skill/ -o splunkbase-skill.skill "${TAG}"

      - name: Archive contents
        run: unzip -l splunkbase-skill.skill

      - name: Release notes from CHANGELOG
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::no CHANGELOG entry for ${version}"; exit 1; }

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" splunkbase-skill.skill --clobber
          else
            gh release create "${TAG}" splunkbase-skill.skill --title "${TAG}" --notes-file notes.md --verify-tag
          fi
